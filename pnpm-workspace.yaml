ignoreWorkspaceRootCheck: true
catalogMode: prefer
blockExoticSubdeps: false
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - tinyexec
  - ast-v8-to-istanbul

strictPeerDependencies: false
fetchTimeout: 180000
shamefullyHoist: true
shellEmulator: true

packages:
  - packages/*
  - docs

overrides:
  '@types/markdown-it': ^14.2.0
  vite: catalog:dev
  vitepress: catalog:prod
  vue: catalog:prod
  vue-tsc: catalog:dev

allowBuilds:
  esbuild: true
  simple-git-hooks: true

catalogs:
  dev:
    '@pengzhanbo/eslint-config-vue': ^2.9.2
    '@pengzhanbo/stylelint-config': ^2.9.2
    '@tsdown/css': ^0.23.0
    '@types/markdown-it': ^14.2.0
    '@types/markdown-it-container': ^4.0.1
    '@types/node': ^26.4.1
    '@types/picomatch': ^4.0.3
    '@types/qrcode': ^1.5.6
    '@vitest/coverage-v8': ^5.0.0
    bumpp: ^12.3.0
    conventional-changelog: ^8.1.3
    conventional-changelog-angular: ^9.4.0
    cpx2: ^9.0.0
    cross-env: ^10.1.0
    eslint: ^10.10.0
    js-tokens: ^10.0.0
    markdown-it: ^14.3.0
    nano-staged: ^1.0.2
    oxc-minify: ^0.148.0
    rimraf: ^6.1.3
    simple-git-hooks: ^2.14.0
    stylelint: ^17.15.0
    tsdown: ^0.23.0
    typescript: ^6.0.3
    unplugin-vue: ^7.2.0
    unrun: ^0.3.1
    vite: ^8.2.2
    vitepress-plugin-group-icons: ^1.7.6
    vitepress-plugin-llms: ^1.13.5
    vitest: ^5.0.0
    vue-tsc: ^3.3.11

  peer:
    '@iconify/json': ^2.2.525
    dashjs: ^5.2.1
    hls.js: ^1.7.2
    mpegts.js: 1.7.3

  prod:
    '@floating-ui/vue': ^2.0.1
    '@mdit/plugin-inline-rule': ^2.2.0
    '@pengzhanbo/utils': ^3.11.0
    '@stackblitz/sdk': ^1.11.1
    '@vueuse/core': ^14.4.0
    ansis: ^4.3.1
    artplayer: ^5.4.0
    destr: ^2.0.5
    gray-matter: ^4.0.3
    local-pkg: ^1.2.1
    markdown-it-container: ^4.0.0
    mermaid: ^11.17.2
    picomatch: ^4.0.7
    qrcode: ^1.5.4
    svgo: ^4.1.0
    tinyglobby: ^0.2.17
    unplugin-icons: ^23.0.1
    unplugin-vue-components: ^32.1.0
    vitepress: ^2.0.0-alpha.20
    vue: ^3.5.42
    watermark-js-plus: ^1.6.6
    yaml: ^2.9.0
    zod: ^4.5.4
