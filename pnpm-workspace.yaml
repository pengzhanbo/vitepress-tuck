    '@stackblitz/sdk': ^1.11.1
    '@vueuse/core': ^14.3.0
    ansis: ^4.3.1
    artplayer: ^5.4.0
    destr: ^2.0.5
    gray-matter: ^4.0.3
    local-pkg: ^1.2.1
    markdown-it-container: ^4.0.0
