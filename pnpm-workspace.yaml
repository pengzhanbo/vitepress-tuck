catalogMode: prefer
ignoreWorkspaceRootCheck: true
shamefullyHoist: true
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - tinyexec
  - ast-v8-to-istanbul

strictPeerDependencies: false
blockExoticSubdeps: false

packages:
  - packages/*
  - docs

allowBuilds:
  esbuild: true
  simple-git-hooks: true

overrides:
  vite: catalog:dev
  vitepress: catalog:prod
  vue: catalog:prod
  vue-tsc: catalog:dev

catalogs:
  dev:
    '@pengzhanbo/eslint-config-vue': ^2.7.1
    '@pengzhanbo/stylelint-config': ^2.7.1
    '@tsdown/css': ^0.22.14
    '@types/markdown-it': ^14.1.2
    '@types/markdown-it-container': ^4.0.0
    '@types/node': ^26.1.1
    '@types/picomatch': ^4.0.3
    '@types/qrcode': ^1.5.6
    '@vitest/coverage-v8': ^4.1.10
    bumpp: ^12.0.0
    conventional-changelog: ^8.1.0
    conventional-changelog-angular: ^9.2.1
    cpx2: ^9.0.0
    cross-env: ^10.1.0
    eslint: ^10.8.0
    js-tokens: ^10.0.0
    markdown-it: ^14.3.0
    nano-staged: ^1.0.2
    oxc-minify: ^0.141.0
    rimraf: ^6.1.3
    simple-git-hooks: ^2.13.1
    stylelint: ^17.14.1
    tsdown: ^0.22.14
    typescript: ^6.0.3
    unplugin-vue: ^7.2.0
    unrun: ^0.3.1
    vite: ^8.1.5
    vitepress-plugin-group-icons: ^1.7.5
    vitepress-plugin-llms: ^1.13.3
    vitest: ^4.1.10
    vue-tsc: ^3.3.8

  peer:
    '@iconify/json': ^2.2.506
    dashjs: ^5.2.0
    hls.js: ^1.6.16
